# Database Configuration
# PostgreSQL on Supabase: set DB_URL, DB_USERNAME and DB_PASSWORD in .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Performance Settings (WITHOUT CACHE)
spring.jpa.properties.hibernate.batch_size=25
spring.jpa.properties.hibernate.fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection Pool Settings (HikariCP)
# Supabase's pooler limits connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# JWT Configuration
# Signing key for login tokens. Required: set JWT_SECRET (64+ random characters) in .env
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=/Users/Teja/Downloads/adminbackend/uploads

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*

# Jackson Date Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd


# Time zone: everything runs on Hyderabad time (see AdminBackendApplication.CINEMA_TIME_ZONE).
# The JVM, JSON and database settings must all match, or stored show times shift.
app.time-zone=Asia/Kolkata
spring.jackson.time-zone=${app.time-zone}
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false

# WebSocket Configuration
spring.websocket.message-broker.stats-enabled=true

# Scheduled Tasks Configuration
spring.task.scheduling.pool.size=2

# Logging Configuration
logging.level.com.example.adminbackend=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG

# File upload configuration

spring.servlet.multipart.enabled=true

# Static resource configuration
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.mvc.static-path-pattern=/uploads/**



spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
gemini.api.key=${GEMINI_API_KEY:}
# Free tier limits requests per model per minute, so the concierge spreads over several Flash models
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.8-flash,gemini-flash-latest,gemini-3.1-flash-lite}


# application.properties

# Stripe Configuration
# Stripe keys come from the environment / .env (never commit them)
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}

# Payment settings
payment.currency=inr
payment.default.ticket.price=250

# TMDB (The Movie Database) - get a key at https://www.themoviedb.org/settings/api
# Accepts either the v3 API key or the v4 API Read Access Token. Keep it in an env var
# or in a .env file (MovieBackend/.env or the project root .env) - never commit it.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
tmdb.api.key=${TMDB_API_KEY:}
tmdb.region=IN
tmdb.language=en-US

# First manager account, created only when no admin exists yet. Set ADMIN_PASSWORD in .env.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@cinebook.local}
app.admin.password=${ADMIN_PASSWORD:}

# Supabase is a network hop away (~300 ms per query): load lazy relations and
# collections for many rows in one query instead of one query per row (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
